[project]
name = "recordprep"
version = "0.1.0"
description = "GTK4/Libadwaita app that converts OCR'd legal transcript PDFs into direct-source case bundles, role-aware summaries, and Agent search metadata."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cryptography>=46.0.7",
    "pdftotext>=3.0.0",
    "pygobject>=3.54.5",
    "pylatexenc>=2.10",
    "pymupdf>=1.26.7",
    "pypdf>=6.6.0",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
]

[project.scripts]
recordprep = "recordprep.cli:main"
