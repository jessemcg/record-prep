    <rect x="100" y="36" width="14" height="14" rx="1" fill="#f5c211"/>
    <rect x="90" y="60" width="12" height="12" rx="1" fill="#ff7800"/>
    <rect x="110" y="66" width="8" height="8" rx="1" fill="#f5c211"/>
    <rect x="90" y="84" width="14" height="14" rx="1" fill="#e66100"/>
    <rect x="78" y="106" width="8" height="8" rx="1" fill="#f5c211"/>
